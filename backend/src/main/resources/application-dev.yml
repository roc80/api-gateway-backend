server:
  port: 8090
cors:
  allowedOriginPatterns: "*"
  allowedMethods: "*"
  allowedHeaders: "*"
  exposedHeaders: "*"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/api_gateway
    username: postgres
    password: 123456
  flyway:
    default-schema: api_gateway

api:
  client:
    access-key: placeholder
    secret-key: placeholder

dubbo:
  application:
    name: dubbo-springboot-demo-provider
    logger: slf4j
  protocol:
    name: tri
    port: 50052
  registry:
    address: nacos://${nacos.address:127.0.0.1}:8848?username=nacos&password=nacos